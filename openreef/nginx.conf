server {
    listen 8099;

    access_log /dev/stdout;
    error_log /dev/stderr info;

    location ~ ^/([^/]+_openreef)$ {
        return 302 /$1/;
    }

    location / {
        set $openreef_ingress_base "";
        if ($request_uri ~ ^(/[^/?]+_openreef)(?:[/?]|$)) {
            set $openreef_ingress_base $1;
        }

        rewrite ^/[a-z0-9]+_openreef/?(.*)$ /$1 break;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_set_header Accept-Encoding "";

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forward headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Ingress-Path $http_x_ingress_path;
        proxy_buffering off;

        # Next.js does not know HA's random ingress prefix at build time.
        # Rewrite root-relative assets/routes so the browser stays inside ingress.
        sub_filter_once off;
        sub_filter_types text/html text/css application/javascript application/json;
        sub_filter '<head>' '<head><base href="$openreef_ingress_base/">';
        sub_filter '="/_next/' '="$openreef_ingress_base/_next/';
        sub_filter '="/api/' '="$openreef_ingress_base/api/';
        sub_filter '="/openreef-logo.png' '="$openreef_ingress_base/openreef-logo.png';
        sub_filter '"/_next/' '"$openreef_ingress_base/_next/';
        sub_filter '"/api/' '"$openreef_ingress_base/api/';
        sub_filter '"/openreef-logo.png' '"$openreef_ingress_base/openreef-logo.png';
    }
}
