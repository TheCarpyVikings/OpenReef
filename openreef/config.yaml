name: "OpenReef"
version: "0.1.4"
slug: "openreef"
description: "Private-beta reef aquarium controller dashboard for Home Assistant"
url: "https://github.com/TheCarpyVikings/OpenReef"
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
stage: experimental
ingress: true
ingress_port: 8099
ingress_entry: "/"
ingress_stream: true
panel_icon: "mdi:fishbowl"
panel_title: "OpenReef"
homeassistant_api: true
watchdog: "http://[HOST]:[PORT:8099]/api/health"
options:
  log_level: "info"
schema:
  log_level: "list(trace|debug|info|notice|warning|error|fatal)"
