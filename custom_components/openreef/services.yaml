apply_mode:
  name: Apply mode
  description: Applies a confirmed OpenReef mode plan. Only explicitly armed equipment controls are changed.
  fields:
    mode_id:
      name: Mode ID
      description: The OpenReef mode identifier to apply.
      required: true
      selector:
        text:

record_manual_reading:
  name: Record manual reading
  description: Records a manual reef parameter reading in OpenReef.
  fields:
    parameter:
      name: Parameter
      description: The OpenReef parameter key, such as alkalinity or nitrate.
      required: true
      selector:
        text:
    value:
      name: Value
      description: Numeric reading value.
      required: true
      selector:
        number:
          mode: box
    date:
      name: Date
      description: Optional ISO date. Defaults to today.
      required: false
      selector:
        text:
    timestamp:
      name: Timestamp
      description: Optional ISO timestamp. Defaults to now.
      required: false
      selector:
        text:
    unit:
      name: Unit
      description: Optional reading unit.
      required: false
      selector:
        text:
    source:
      name: Test kit or source
      description: Optional source, such as Hanna, Salifert, Red Sea, ICP, Apex, or Trident.
      required: false
      selector:
        text:
    notes:
      name: Notes
      description: Optional reading notes.
      required: false
      selector:
        text:

arm_equipment:
  name: Arm equipment
  description: Allows OpenReef to control one mapped switch entity.
  fields:
    equipment_id:
      name: Equipment ID
      description: The OpenReef equipment identifier to arm.
      required: true
      selector:
        text:

disarm_equipment:
  name: Disarm equipment
  description: Locks OpenReef control for one mapped switch entity.
  fields:
    equipment_id:
      name: Equipment ID
      description: The OpenReef equipment identifier to disarm.
      required: true
      selector:
        text:
