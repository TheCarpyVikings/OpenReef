# --- Sensors -----------------------------------------------------------------
sensor:
  - platform: homeassistant
    id: tank_ph
    entity_id: sensor.openreef_kalk_ph_mirror   # FIXED id — never a raw probe
    on_value:
      - lambda: |-
          if (!std::isnan(x)) {
            id(ph_last_update) = millis();
            if (x >= id(kalk_ph_stop).state) {
              id(ph_latched_high) = true;
            } else if (x < id(kalk_ph_resume).state) {
              id(ph_latched_high) = false;
            }
          }
  - platform: template
    name: "Kalk Dosed Today (ml)"
    id: kalk_dosed_today
    unit_of_measurement: "ml"
    accuracy_decimals: 2
    lambda: 'return id(dosed_today_ml);'
    update_interval: 30s
  - platform: template
    name: "Live Food Dosed Today (ml)"
    id: livefood_dosed_today
    unit_of_measurement: "ml"
    accuracy_decimals: 2
    lambda: 'return id(lf_dosed_today_ml);'
    update_interval: 30s

binary_sensor:
  # PUMPS-ONLY NODE: no leak / display-high / tank floats here — flood-hazard
  # sensing belongs to a future sensor node and acts through HA's guards.
  #
  # The two reservoir-low floats are STUBBED CLEAR, names untouched, so the
  # frozen auto-bind contract still counts 25/25 + 22/22 and the guard chains
  # keep their reservoir_low step. Accepted trade (MULTINODE_PIVOT_BRIEF §4):
  # the software reservoir ledger in OpenReef is the empty-guard on this node.
  - platform: template
    name: "Kalk Reservoir Low"
    id: kalk_reservoir_low
    lambda: 'return false;'   # no float fitted — permanently clear by design
  - platform: template
    name: "Live Food Reservoir Low"
    id: livefood_reservoir_low
    lambda: 'return false;'   # no float fitted — permanently clear by design
  - platform: template
    name: "Live Food Chaser Skipped"
    id: livefood_chaser_skipped
    # Holds the LAST dose's chaser outcome: true = skipped (AWC owned the fresh
    # pump), false = chaser ran. OpenReef reads this when it debits the rinse.

text_sensor:
  # NB: ESPHome text_sensor entities register in HA under `sensor.` — the
  # auto-bind rows are sensor.<p>_kalk_last_skip_reason /
  # sensor.<p>_live_food_last_skip_reason (contract rev 2 rule).
  - platform: template
    name: "Kalk Last Skip Reason"
    id: kalk_last_skip
    update_interval: never
  - platform: template
    name: "Live Food Last Skip Reason"
    id: livefood_last_skip
    update_interval: never

# --- Kalk stepper ------------------------------------------------------------
stepper:
  - platform: tmc2209
    id: kalk_driver
    max_speed: 400 steps/s
    acceleration: 1000 steps/s^2
    deceleration: 1000 steps/s^2
    rsense: 110 mOhm
    vsense: False
    address: 0x00
    enn_pin: GPIO5     # Node 1 map (reefnode used GPIO13)
    index_pin: GPIO6   # Node 1 map (reefnode used GPIO14)
    on_boot:
      - tmc2209.configure:
          microsteps: 16
          interpolation: true
      - tmc2209.currents:
          standstill_mode: freewheeling
          run_current: 0.6A
          ihold: 0
          iholddelay: 0
          tpowerdown: 0

# --- Buttons -----------------------------------------------------------------
button:
  # Kalk channel (frozen names)
  - platform: template
    name: "Kalk Prime / Test (run 5s)"
    id: kalk_prime_button
    on_press:
      - stepper.set_speed:
          id: kalk_driver
          speed: !lambda 'return id(kalk_speed).state;'
      - stepper.report_position:
          id: kalk_driver
          position: 0
      - stepper.set_target:
          id: kalk_driver
          target: !lambda 'return (int)(id(kalk_speed).state * 5);'
  - platform: template
    name: "Kalk Dose Now (one dose)"
    id: kalk_dose_now_button
    on_press:
      - script.execute: do_one_dose
  - platform: template
    name: "Kalk Manual Dose"
    id: kalk_manual_dose_button
    on_press:
      - script.execute: do_manual_dose
  - platform: template
    name: "Kalk Calibrate 100 rev"
    id: kalk_calibrate_button
    on_press:
      - stepper.set_speed:
          id: kalk_driver
          speed: !lambda 'return id(kalk_speed).state;'
      - stepper.report_position:
          id: kalk_driver
          position: 0
      - stepper.set_target:
          id: kalk_driver
          target: 320000

  # Live-food channel (frozen names)
  - platform: template
    name: "Live Food Prime / Test (run 5s)"
    id: livefood_prime_button
    on_press:
      # Guard-free but hard-bounded: 5 s raw run for first-fill/direction checks.
      - switch.turn_on: livefood_pump
      - delay: 5s
      - switch.turn_off: livefood_pump
  - platform: template
    name: "Live Food Dose Now (one dose)"
    id: livefood_dose_now_button
    on_press:
      - script.execute: lf_do_one_dose
  - platform: template
    name: "Live Food Manual Dose"
    id: livefood_manual_dose_button
    on_press:
      - script.execute: lf_do_manual_dose
  - platform: template
    name: "Live Food Calibrate 30s"
    id: livefood_calibrate_button
    on_press:
      # Fixed 30 s burst into a measuring jug; the panel derives ml/s and writes
      # Live Food Flow (ml/s). Guard-free by design: calibration must work on an
      # uncalibrated (flow == 0) channel.
      - switch.turn_on: livefood_pump
      - delay: 30s
      - switch.turn_off: livefood_pump

# --- Scheduled-dose executors -------------------------------------------------
interval:
  - interval: 60s
    then:
      - lambda: |-
          // Kalk: re-seed the calibration global from the restored number.
          id(steps_per_ml) = id(kalk_steps_per_ml).state;
          auto now = id(reef_time).now();
          if (!now.is_valid()) return;   // no clock => no schedule (fail closed)
          const int mod = now.hour * 60 + now.minute;
          {
            const int ws = (int) id(kalk_window_start_min).state;
            const int we = (int) id(kalk_window_end_min).state;
            const bool in_window = (ws == we) ||
                                   ((ws < we) ? (mod >= ws && mod < we)
                                              : (mod >= ws || mod < we));
            const int ns = (int) id(kalk_night_start_min).state;
            const int ne = (int) id(kalk_night_end_min).state;
            const bool night = (ns != ne) &&
                               ((ns < ne) ? (mod >= ns && mod < ne)
                                          : (mod >= ns || mod < ne));
            int cadence = (int) (night ? id(kalk_night_interval_min).state
                                       : id(kalk_interval_min).state);
            if (cadence < 1) cadence = 1;
            id(interval_elapsed_min) += 1;
            if (in_window && id(interval_elapsed_min) >= cadence) {
              id(interval_elapsed_min) = 0;
              id(do_one_dose).execute();
            }
          }
          {
            const int ws = (int) id(livefood_window_start_min).state;
            const int we = (int) id(livefood_window_end_min).state;
            const bool in_window = (ws == we) ||
                                   ((ws < we) ? (mod >= ws && mod < we)
                                              : (mod >= ws || mod < we));
            const int ns = (int) id(livefood_night_start_min).state;
            const int ne = (int) id(livefood_night_end_min).state;
            const bool night = (ns != ne) &&
                               ((ns < ne) ? (mod >= ns && mod < ne)
                                          : (mod >= ns || mod < ne));
            int cadence = (int) (night ? id(livefood_night_interval_min).state
                                       : id(livefood_interval_min).state);
            if (cadence < 1) cadence = 1;
            id(lf_interval_elapsed_min) += 1;
            if (in_window && id(lf_interval_elapsed_min) >= cadence) {
              id(lf_interval_elapsed_min) = 0;
              id(lf_do_one_dose).execute();
            }
          }

# =============================================================================
# In OpenReef, after flashing (friendly_name "OpenReef Dosing" assumed):
#
# Water Change → Setup & calibration (EXPLICIT bind — pick these manually):
#   Drain pump          -> switch.openreef_dosing_awc_drain_pump
#   Fill pump (src 1)   -> switch.openreef_dosing_awc_fill_pump
#   (source 2, leak, display-high and the tank floats live on future nodes —
#    leave those pickers empty; HA-side guards engage once they exist)
#
# Dosing → kalk channel → Auto-bind: expect 25 of 25 (contract rev 3).
# Dosing → live-food channel → Auto-bind: expect 22 of 22.
#
# Toggle directly in HA when a firmware latch trips (not surfaced in the panel):
#   Firmware latch clear -> switch.openreef_dosing_clear_lock
# =============================================================================
