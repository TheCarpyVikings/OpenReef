# =============================================================================
# OpenReef — DOSING NODE: 4-channel dosing station on an ESP32-S3 Zero (Node 1)
# =============================================================================
# First node of the multi-node topology (MULTINODE_PIVOT_BRIEF.md): each
# equipment group gets its own ESP32. THIS node is PUMPS ONLY — no physical
# sensors of any kind. Tank telemetry and tank-side safety (pH probe, leak,
# display-high, tank floats) live on OTHER nodes, later, syncing through HA.
# This file is THE build authority for Node 1; the pin budget below is what
# gets plugged. (The single-node path lives on in reefnode-s3-reference.yaml
# as an alternative topology.)
#
# THE ENTITY NAMES ARE A FROZEN CONTRACT (two tables):
#   - Kalk channel:      kalk-doser-esphome-design.md §6  (contract rev 3)
#   - Live-food channel: reefnode-s3-design.md §3         (frozen at Stage D)
# The OpenReef panel auto-binds dosing channels by these entity-id suffixes.
# Rename the node freely; NEVER rename an entity. AWC pumps are explicit-bind
# (picked manually in the panel) but keep the reference names.
#
# -----------------------------------------------------------------------------
# NODE 1 PIN BUDGET — ESP32-S3 Zero (header pins GP1–GP13 + GP43/44; GP3 is
# strapping, skipped; GP14–18 exist only as bottom pads, unused; 33–37 not
# broken out on this board):
#
#   GPIO1   drain_pump  D4184 TRIG     (out)
#   GPIO2   fresh_pump  D4184 TRIG     (out)  fill — source 1
#   GPIO4   livefood_pump D4184 TRIG   (out)
#   GPIO5   TMC2209 ENN                (out, low = enabled)
#   GPIO6   TMC2209 INDEX              (in)
#   GPIO43  TMC2209 UART TX            (out, 500 kBd)  — UART0's default pin
#   GPIO44  TMC2209 UART RX            (in)            — UART0's default pin
#   spares: GP3 (avoid — strapping), GP7–GP13; GP21 (or GP48 on some clones):
#           onboard WS2812 — see status_led_pin below.
#
# HARD CONSTRAINT: UART0's pins belong to the TMC2209, so the logger MUST run
# on native USB (`hardware_uart: USB_CDC` under arduino; USB_SERIAL_JTAG under
# esp-idf). Without that line the boot log corrupts the stepper driver.
#
# KNOWN AND HARMLESS: the S3 ROM prints its own boot output on GP43 at EVERY
# reset, before any firmware runs, regardless of logger config. The TMC2209's
# UART protocol is CRC-guarded, so it ignores that noise. Do not chase it as a
# fault when sniffing the UART lines.
#
# FIRST FLASH: native USB, no bridge chip — hold BOOT while connecting USB-C.
# USB-CDC logs only appear after USB enumerates; early boot is invisible.
#
# -----------------------------------------------------------------------------
# Safety model on THIS node (be honest — it is thinner than the reefnode's):
#   1. Everything boots OFF (ALWAYS_OFF).
#   2. Per-pump MAX-RUNTIME watchdogs FAIL-LOCK the node (latched re-arm via
#      Clear Lock). This is a SOFTWARE latch: there is no master relay here.
#   3. Reservoir empty-guards are the SOFTWARE ledgers in OpenReef; the
#      reservoir-low floats are stubbed clear below (no floats fitted).
#   4. Flood-hazard sensing (leak, display-high) belongs to a future sensor
#      node; HA-side guards act on it once bound.
#
# RESIDUAL RISK, stated plainly: a shorted MOSFET or a shorted TMC2209 on this
# node runs until 12 V is pulled. The mitigations are the fused motor rail,
# dose lines ending IN AIR above the waterline, and reservoir sizing — never
# plumb more water than the tank can absorb. The bench gate in
# dosingnode-s3zero-design.md §5 (D4184 TRIG must sit LOW when floating; add a
# 10 k pull-down if it does not) is what preserves boot/crash fail-OFF.
# =============================================================================

substitutions:
  node_name: openreef-dosing
  # friendly_name is PART OF THE FROZEN AUTO-BIND CONTRACT (rev 2): it prefixes
  # every entity id (e.g. `number.openreef_dosing_kalk_dose_volume_ml`). The
  # prefix may vary per node — the SUFFIX may not. Multi-node convention:
  # "OpenReef <Function>" per node, so ids never collide across nodes.
  friendly_name: OpenReef Dosing
  # Onboard WS2812. Genuine Waveshare Zero = GPIO21; some clones = GPIO48.
  # Verify at first flash (enable the commented light block below); if it stays
  # dark, change THIS line only.
  status_led_pin: GPIO21
  timezone: Europe/London
  # Watchdog backstops — comfortably above a normal calibrated runtime.
  # OpenReef stops AWC pumps at the calibrated time; these fire only when that
  # never happened (network down + something wrong). The live-food head doses
  # millilitres, so its ceiling is tight.
  drain_max_runtime: "180s"
  fill_max_runtime: "180s"
  livefood_max_runtime: "60s"

esphome:
  name: ${node_name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -100          # very late: only after everything initialised cleanly
    then:
      - logger.log: "Dosing node boot complete. No master relay on this node — pumps stay OFF until commanded."

esp32:
  board: esp32-s3-devkitc-1   # works for the S3 Zero; no Zero-specific def needed
  flash_size: 4MB             # S3FH4R2 = 4 MB. Verify clones via esptool flash_id.
  framework:
    type: arduino

external_components:
  # PIN this to a known-good ref before first compile and verify the
  # stepper/tmc2209 API names (see kalk-doser-esphome-design.md §7).
  - source: github://slimcdk/esphome-custom-components
    components: [ tmc2209_hub, tmc2209, stepper ]

# Local network/API — NONE of the safety below depends on it being up.
api:
ota:
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

logger:
  # MANDATORY on this board: UART0's pins (GP43/44) drive the TMC2209, so logs
  # must use native USB. (esp-idf equivalent: USB_SERIAL_JTAG.)
  hardware_uart: USB_CDC

# Optional status LED (onboard WS2812). Left commented so first compile has no
# unverified component; enable once flashing works, then check the pin.
# light:
#   - platform: esp32_rmt_led_strip
#     id: status_led
#     name: "Status LED"
#     pin: ${status_led_pin}
#     num_leds: 1
#     rgb_order: GRB
#     chipset: ws2812
#     rmt_channel: 0

time:
  - platform: sntp
    id: reef_time
    timezone: ${timezone}
    on_time:
      # SNTP local midnight — reset both dosers' daily totals.
      - seconds: 0
        minutes: 0
        hours: 0
        then:
          - script.execute: reset_daily_total

uart:
  id: tmc_uart
  tx_pin: GPIO43   # UART0 default pin — see logger note above
  rx_pin: GPIO44
  baud_rate: 500000

# --- Globals -----------------------------------------------------------------
globals:
  - id: awc_locked
    type: bool
    restore_value: no
    initial_value: "false"
  # Kalk channel (design authority: kalk-doser-esphome-design.md §5)
  - id: steps_per_ml
    type: float
    restore_value: true
    initial_value: '0'          # 0 = NOT CALIBRATED — blocks all kalk dosing
  - id: dosed_today_ml
    type: float
    restore_value: true
    initial_value: '0'
  - id: ph_latched_high
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: ph_last_update
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: guard_pass
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: interval_elapsed_min
    type: int
    restore_value: false
    initial_value: '0'
  # 2-part spacing (Stage E): epoch seconds of each group's last dose ON THIS
  # NODE. kalk stamps the alk slot; a future Ca head stamps ca and checks alk.
  - id: group_alk_last_ts
    type: long
    restore_value: false
    initial_value: '0'
  - id: group_ca_last_ts
    type: long
    restore_value: false
    initial_value: '0'
  # Live-food channel (brushed; time-based motion instead of steps)
  - id: lf_dosed_today_ml
    type: float
    restore_value: true
    initial_value: '0'
  - id: lf_guard_pass
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: lf_interval_elapsed_min
    type: int
    restore_value: false
    initial_value: '0'

# --- Shared kill / trip / latch ----------------------------------------------
script:
  - id: kill_all_pumps
    then:
      - switch.turn_off: drain_pump
      - switch.turn_off: fresh_pump
      - switch.turn_off: livefood_pump
  - id: trip_lock
    then:
      - globals.set: { id: awc_locked, value: "true" }
      - script.execute: kill_all_pumps
      - logger.log:
          level: WARN
          # SOFTWARE latch only on this node — there is no relay to drop. A
          # shorted driver is outside its reach; see the residual-risk header.
          format: "DOSING NODE HARD TRIP — pumps killed, node latched. Manual re-arm required."
  - id: drain_watchdog
    mode: restart
    then:
      - delay: ${drain_max_runtime}
      - logger.log: "Drain pump exceeded max-runtime — tripping."
      - script.execute: trip_lock
  - id: fill_watchdog
    mode: restart
    then:
      - delay: ${fill_max_runtime}
      - logger.log: "Fresh (source 1) pump exceeded max-runtime — tripping."
      - script.execute: trip_lock
  - id: livefood_watchdog
    mode: restart
    then:
      - delay: ${livefood_max_runtime}
      - logger.log: "Live-food pump exceeded max-runtime — tripping."
      - script.execute: trip_lock

  # --- Kalk channel scripts (verbatim from kalk-doser-esphome-design.md §5,
  #     only pins/time-id changed) -------------------------------------------
  - id: check_guards
    mode: restart
    parameters:
      dose_ml: float
    then:
      - lambda: |-
          std::string reason;   // empty = pass
          if (!id(kalk_enabled).state) {
            reason = "disabled";
          } else if (id(kalk_ha_suspend).state) {
            reason = "ha_suspend";
          } else if (id(kalk_reservoir_low).state) {
            reason = "reservoir_low";
          } else if (id(steps_per_ml) <= 0.0f) {
            reason = "not_calibrated";
          } else {
            const int ws = (int) id(kalk_window_start_min).state;
            const int we = (int) id(kalk_window_end_min).state;
            bool in_window = (ws == we);
            if (!in_window) {
              auto now = id(reef_time).now();
              if (now.is_valid()) {
                const int mod = now.hour * 60 + now.minute;
                in_window = (ws < we) ? (mod >= ws && mod < we)
                                      : (mod >= ws || mod < we);
              }
            }
            if (!in_window) {
              reason = "out_of_window";
            } else {
              bool ph_ok = true;
              if (id(kalk_ph_guard).state) {
                if (api::global_api_server == nullptr ||
                    !api::global_api_server->is_connected()) {
                  ph_ok = false;
                } else if (std::isnan(id(tank_ph).state)) {
                  ph_ok = false;
                } else if ((millis() - id(ph_last_update)) > 1800000UL) {
                  ph_ok = false;
                } else if (id(ph_latched_high)) {
                  ph_ok = false;
                }
              }
              if (!ph_ok) {
                reason = "ph_guard";
              } else if ((id(dosed_today_ml) + dose_ml) >
                         id(kalk_max_daily_ml).state) {
                reason = "daily_cap";
              } else if (id(kalk_min_gap_min).state > 0.0f &&
                         id(group_ca_last_ts) > 0) {
                // Step 8 (Stage E): 2-part spacing — refuse while another group
                // dosed on this node inside the gap. Per-node by design.
                auto now2 = id(reef_time).now();
                if (now2.is_valid() &&
                    (now2.timestamp - id(group_ca_last_ts)) <
                        (long)(id(kalk_min_gap_min).state * 60.0f)) {
                  reason = "spacing";
                }
              }
            }
          }
          id(guard_pass) = reason.empty();
          if (!reason.empty()) {
            id(kalk_last_skip).publish_state(reason);
            ESP_LOGW("kalk", "Dose skipped: %s", reason.c_str());
          }
  - id: run_dose
    mode: single
    parameters:
      dose_ml: float
    then:
      - stepper.set_speed:
          id: kalk_driver
          speed: !lambda 'return id(kalk_speed).state;'
      - stepper.report_position:
          id: kalk_driver
          position: 0
      - stepper.set_target:
          id: kalk_driver
          target: !lambda 'return (int)(dose_ml * id(steps_per_ml));'
      - globals.set:
          id: dosed_today_ml
          value: !lambda 'return id(dosed_today_ml) + dose_ml;'
      - lambda: |-
          auto now = id(reef_time).now();
          char buf[16];
          if (now.is_valid()) {
            id(group_alk_last_ts) = now.timestamp;   // 2-part spacing epoch (alk)
            snprintf(buf, sizeof(buf), "ok %02d:%02d", now.hour, now.minute);
          } else {
            snprintf(buf, sizeof(buf), "ok");
          }
          id(kalk_last_skip).publish_state(buf);
  - id: do_one_dose
    mode: single
    then:
      - script.execute:
          id: check_guards
          dose_ml: !lambda 'return id(kalk_dose_ml).state;'
      - script.wait: check_guards
      - if:
          condition:
            lambda: 'return id(guard_pass);'
          then:
            - script.execute:
                id: run_dose
                dose_ml: !lambda 'return id(kalk_dose_ml).state;'
  - id: do_manual_dose
    mode: single
    then:
      - script.execute:
          id: check_guards
          dose_ml: !lambda 'return id(kalk_manual_dose_ml).state;'
      - script.wait: check_guards
      - if:
          condition:
            lambda: 'return id(guard_pass);'
          then:
            - script.execute:
                id: run_dose
                dose_ml: !lambda 'return id(kalk_manual_dose_ml).state;'
  - id: ha_suspend_expiry
    mode: restart
    then:
      - delay: 4h
      - switch.turn_off: kalk_ha_suspend
      - logger.log:
          level: WARN
          format: "Kalk HA-suspend auto-expired after 4 h (HA never cleared it)."
  - id: reset_daily_total
    then:
      - globals.set: { id: dosed_today_ml, value: '0' }
      - globals.set: { id: lf_dosed_today_ml, value: '0' }

  # --- Live-food channel scripts (brushed: time-based motion) ----------------
  # Same guard-chain order as kalk MINUS the pH step (no probe hardware on a
  # brushed head); same frozen skip-reason vocabulary.
  - id: lf_check_guards
    mode: restart
    parameters:
      dose_ml: float
    then:
      - lambda: |-
          std::string reason;   // empty = pass
          if (!id(livefood_enabled).state) {
            reason = "disabled";
          } else if (id(livefood_ha_suspend).state) {
            reason = "ha_suspend";
          } else if (id(livefood_reservoir_low).state) {
            reason = "reservoir_low";
          } else if (id(livefood_flow_ml_s).state <= 0.0f) {
            reason = "not_calibrated";
          } else {
            const int ws = (int) id(livefood_window_start_min).state;
            const int we = (int) id(livefood_window_end_min).state;
            bool in_window = (ws == we);
            if (!in_window) {
              auto now = id(reef_time).now();
              if (now.is_valid()) {
                const int mod = now.hour * 60 + now.minute;
                in_window = (ws < we) ? (mod >= ws && mod < we)
                                      : (mod >= ws || mod < we);
              }
            }
            if (!in_window) {
              reason = "out_of_window";
            } else if ((id(lf_dosed_today_ml) + dose_ml) >
                       id(livefood_max_daily_ml).state) {
              reason = "daily_cap";
            }
          }
          id(lf_guard_pass) = reason.empty();
          if (!reason.empty()) {
            id(livefood_last_skip).publish_state(reason);
            ESP_LOGW("livefood", "Dose skipped: %s", reason.c_str());
          }
  - id: lf_run_dose
    mode: single
    parameters:
      dose_ml: float
    then:
      # Time-based motion: runtime = (dose − spin-up) / flow, clamped ≥ 0. The
      # pump's own watchdog still backstops the delay.
      - switch.turn_on: livefood_pump
      - delay: !lambda |-
          float flow = id(livefood_flow_ml_s).state;
          float net = dose_ml - id(livefood_spin_up_ml).state;
          if (flow <= 0.0f || net <= 0.0f) return (uint32_t) 0;
          return (uint32_t) (net / flow * 1000.0f);
      - switch.turn_off: livefood_pump
      - globals.set:
          id: lf_dosed_today_ml
          value: !lambda 'return id(lf_dosed_today_ml) + dose_ml;'
      - lambda: |-
          auto now = id(reef_time).now();
          char buf[16];
          if (now.is_valid()) {
            snprintf(buf, sizeof(buf), "ok %02d:%02d", now.hour, now.minute);
          } else {
            snprintf(buf, sizeof(buf), "ok");
          }
          id(livefood_last_skip).publish_state(buf);
      # Fresh chaser: rinse the food line with fresh saltwater AFTER the dose.
      # Skips (and says so) when the AWC currently owns the fresh pump — the
      # water change wins; OpenReef reads the flag and skips the ledger debit.
      - if:
          condition:
            lambda: 'return id(livefood_chaser_s).state > 0.0f;'
          then:
            - if:
                condition:
                  switch.is_on: fresh_pump
                then:
                  - lambda: 'id(livefood_chaser_skipped).publish_state(true);'
                  - logger.log: "Live-food chaser skipped — AWC owns the fresh pump."
                else:
                  - lambda: 'id(livefood_chaser_skipped).publish_state(false);'
                  - switch.turn_on: fresh_pump
                  - delay: !lambda 'return (uint32_t)(id(livefood_chaser_s).state * 1000.0f);'
                  - switch.turn_off: fresh_pump
  - id: lf_do_one_dose
    mode: single
    then:
      - script.execute:
          id: lf_check_guards
          dose_ml: !lambda 'return id(livefood_dose_ml).state;'
      - script.wait: lf_check_guards
      - if:
          condition:
            lambda: 'return id(lf_guard_pass);'
          then:
            - script.execute:
                id: lf_run_dose
                dose_ml: !lambda 'return id(livefood_dose_ml).state;'
  - id: lf_do_manual_dose
    mode: single
    then:
      - script.execute:
          id: lf_check_guards
          dose_ml: !lambda 'return id(livefood_manual_dose_ml).state;'
      - script.wait: lf_check_guards
      - if:
          condition:
            lambda: 'return id(lf_guard_pass);'
          then:
            - script.execute:
                id: lf_run_dose
                dose_ml: !lambda 'return id(livefood_manual_dose_ml).state;'
  - id: lf_ha_suspend_expiry
    mode: restart
    then:
      - delay: 4h
      - switch.turn_off: livefood_ha_suspend
      - logger.log:
          level: WARN
          format: "Live-food HA-suspend auto-expired after 4 h (HA never cleared it)."

# --- Switches: pumps + latch clear (no master relay on this node) -------------
switch:
  - platform: gpio
    id: drain_pump
    name: "AWC Drain Pump"
    pin: GPIO1                           # D4184 TRIG
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - if:
          condition:
            # No waste-full float on this node — the software ledger guards it.
            lambda: "return id(awc_locked);"
          then:
            - switch.turn_off: drain_pump
            - logger.log: "Drain blocked (node latched)."
          else:
            - script.execute: drain_watchdog
    on_turn_off:
      - script.stop: drain_watchdog

  - platform: gpio
    id: fresh_pump
    name: "AWC Fill Pump"                # keep the classic name so existing
    pin: GPIO2                           # panel bindings carry over (D4184 TRIG)
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - if:
          condition:
            # No fresh-empty float / display-high sensor on this node — the
            # software ledger and (future sensor-node) HA guards cover those.
            lambda: "return id(awc_locked);"
          then:
            - switch.turn_off: fresh_pump
            - logger.log: "Fill blocked (node latched)."
          else:
            - script.execute: fill_watchdog
    on_turn_off:
      - script.stop: fill_watchdog

  - platform: gpio
    id: livefood_pump
    name: "Live Food Pump"               # driven by the lf_* scripts; exposed
    pin: GPIO4                           # for diagnostics — do not automate it (D4184 TRIG)
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - if:
          condition:
            lambda: "return id(awc_locked);"
          then:
            - switch.turn_off: livefood_pump
            - logger.log: "Live-food pump blocked (node latched)."
          else:
            - script.execute: livefood_watchdog
    on_turn_off:
      - script.stop: livefood_watchdog

  - platform: template
    name: "Clear Lock"                   # displays as "OpenReef Dosing Clear Lock"
    optimistic: true
    turn_on_action:
      - globals.set: { id: awc_locked, value: "false" }
      - logger.log: "Dosing node lock cleared."

  # Kalk channel switches (frozen names — contract rev 2)
  - platform: template
    name: "Kalk Dosing Enabled"
    id: kalk_enabled
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: template
    name: "Kalk HA Suspend"
    id: kalk_ha_suspend
    optimistic: true
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - script.execute: ha_suspend_expiry
    on_turn_off:
      - script.stop: ha_suspend_expiry
  - platform: template
    name: "Kalk pH Guard Enabled"
    id: kalk_ph_guard
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

  # Live-food channel switches (frozen names — Stage D contract). The enable
  # switch is ALSO the freshness posture: OpenReef turns it OFF the moment the
  # culture goes stale and re-asserts every sync (the firmware cannot see
  # freshness — HA owns that signal; this switch holds the posture).
  - platform: template
    name: "Live Food Dosing Enabled"
    id: livefood_enabled
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: template
    name: "Live Food HA Suspend"
    id: livefood_ha_suspend
    optimistic: true
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - script.execute: lf_ha_suspend_expiry
    on_turn_off:
      - script.stop: lf_ha_suspend_expiry

# --- Numbers -----------------------------------------------------------------
number:
  # Kalk channel (frozen names — kalk-doser-esphome-design.md §6, rev 2)
  - platform: template
    name: "Kalk Dose Volume (ml)"
    id: kalk_dose_ml
    entity_category: config
    optimistic: true
    restore_value: true
    unit_of_measurement: "ml"
    min_value: 0.1
    max_value: 10
    step: 0.01
    initial_value: 2.08
    mode: box
  - platform: template
    name: "Kalk Dose Interval (min)"
    id: kalk_interval_min
    entity_category: config
    optimistic: true
    restore_value: true
    unit_of_measurement: "min"
    min_value: 1
    max_value: 240
    step: 1
    initial_value: 10
    mode: box
  - platform: template
    name: "Kalk Night Interval (min)"
    id: kalk_night_interval_min
    entity_category: config
    optimistic: true
    restore_value: true
    unit_of_measurement: "min"
    min_value: 1
    max_value: 240
    step: 1
    initial_value: 10
    mode: box
  - platform: template
    name: "Kalk Max Daily (ml)"
    id: kalk_max_daily_ml
    entity_category: config
    optimistic: true
    restore_value: true
    unit_of_measurement: "ml"
    min_value: 0
    max_value: 1000
    step: 5
    initial_value: 300
    mode: box
  - platform: template
    name: "Kalk Dose Speed (steps/s)"
    id: kalk_speed
    entity_category: config
    optimistic: true
    restore_value: true
    min_value: 50
    max_value: 2000
    step: 10
    initial_value: 400
    mode: box
  - platform: template
    name: "Kalk Run Current (A)"
    id: kalk_run_current
    entity_category: config
    optimistic: true
    restore_value: true
    unit_of_measurement: "A"
    min_value: 0.1
    max_value: 1.0
