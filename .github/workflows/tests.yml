name: tests

# Fast, dependency-free checks for the OpenReef custom integration. The Python
# tests stub Home Assistant + voluptuous (see tests/_ha_stubs.py) and the panel
# tests stub the browser (see tests/_panel_harness.mjs), so nothing needs to be
# installed — no HA, no jsdom, no test runner.
#
# Suites are DISCOVERED, never listed: enumerating them one step at a time is how
# five suites (guardian, icp, mode timers, salinity, trust moat) silently sat out
# of CI. Anything matching tests/test_*.py or tests/test_*.mjs runs here.

on:
  push:
    paths:
      - "custom_components/openreef/**"
      - "tests/**"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "custom_components/openreef/**"
      - "tests/**"
      - ".github/workflows/tests.yml"

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      TZ: UTC   # the fixed-day schedule cases are calendar-local on both sides
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Backend compiles
        run: python3 -m py_compile custom_components/openreef/*.py

      - name: Panel JS syntax
        run: node --check custom_components/openreef/frontend/openreef-panel.js

      - name: Python suites
        run: |
          status=0
          for suite in tests/test_*.py; do
            echo "::group::$suite"
            python3 "$suite" || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: Panel suites
        run: |
          status=0
          for suite in tests/test_*.mjs; do
            echo "::group::$suite"
            node "$suite" || status=1
            echo "::endgroup::"
          done
          exit $status
