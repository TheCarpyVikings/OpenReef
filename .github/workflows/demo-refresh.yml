name: demo refresh

# Rung 3 of the demo maintenance ladder: the monthly self-refresh. Demo
# fixtures are generated by the REAL backend handlers inside the tests/
# fake-HA harness, so CI can rebuild the whole demo without a Home Assistant
# anywhere: regenerate + re-pin the panel, build the site, run the smoke gate
# (every tab + Pulse present mode + the opener; zero console errors, zero
# unanswered WS commands), and open a PR with the result. Merging the PR
# deploys via Vercel and closes the drift issue via the demo-drift workflow.
#
# If the smoke gate fails, the panel needs shim/fixture work a robot should
# not guess at — the workflow fails and files an issue pointing at the run.
#
# Note: creating the PR needs "Allow GitHub Actions to create and approve
# pull requests" enabled under Settings → Actions → General.

on:
  schedule:
    - cron: "13 6 1 * *" # monthly, the 1st at 06:13 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "Refresh even if the pinned panel is already current"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    if: github.repository == 'TheCarpyVikings/OpenReef'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # drift report + branch push both need history

      - name: Is a refresh needed?
        id: need
        run: |
          if cmp -s custom_components/openreef/frontend/openreef-panel.js \
                    site/public/demo/openreef-panel.js \
             && [ "${{ inputs.force }}" != "true" ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "Pinned panel is already current — nothing to refresh." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v7
        if: steps.need.outputs.needed == 'true'
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        if: steps.need.outputs.needed == 'true'
        with:
          node-version: "22"

      # Plain global install, no corepack: a packageManager pin in
      # site/package.json broke the Vercel build (its corepack chokes),
      # so the pnpm version is pinned here instead. It must be pnpm 10:
      # site/pnpm-workspace.yaml uses the pnpm-10 `allowBuilds` key, which
      # pnpm 9 misreads as an empty workspace ("packages field missing").
      - name: Install site dependencies
        if: steps.need.outputs.needed == 'true'
        working-directory: site
        run: |
          npm install -g pnpm@10
          pnpm install --frozen-lockfile

      - name: Drift report (for the PR body), then regenerate + re-pin
        if: steps.need.outputs.needed == 'true'
        run: |
          python3 site/tools/demo-drift.py --markdown pr-body.md || true
          python3 site/tools/demo-fixtures.py

      - name: Build the site
        if: steps.need.outputs.needed == 'true'
        working-directory: site
        run: pnpm build

      - name: Smoke gate — every tab, Pulse, the opener
        if: steps.need.outputs.needed == 'true'
        working-directory: site
        run: node tools/demo-smoke.mjs

      - name: Open the refresh PR
        if: steps.need.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          {
            echo "Automated monthly refresh: fixtures regenerated by the real backend"
            echo "handlers, panel re-pinned, smoke gate green (every tab + Pulse + the"
            echo "opener; zero console errors, zero unanswered WS commands)."
            echo
            echo "## What the demo was missing before this PR"
            echo
            cat pr-body.md
          } > pr-full.md
          git checkout -B demo-refresh
          git add site/public/demo site/public/openreef_static/avatar
          if git diff --cached --quiet; then
            echo "Nothing changed after regeneration — no PR needed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "Site: monthly demo refresh — re-pin panel + regenerate fixtures" \
            -m "Generated by the demo-refresh workflow; smoke gate passed."
          git push -f origin demo-refresh
          if [ -z "$(gh pr list --head demo-refresh --state open --json number --jq '.[0].number')" ]; then
            gh pr create --head demo-refresh \
              --title "Demo refresh: the showroom catches up with the panel" \
              --body-file pr-full.md
          else
            echo "Existing demo-refresh PR updated by force-push." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: File an issue if the refresh failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create demo-refresh-failed --color B60205 \
            --description "The monthly demo refresh needs a human" --force
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body="The demo refresh failed its gate — most likely the panel now needs \
          shim routes or fixture handlers the robot can't guess at. Run: $run_url — \
          reproduce locally with \`pnpm demo:refresh\` in \`site/\`."
          existing=$(gh issue list --label demo-refresh-failed --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Failed again: $run_url"
          else
            gh issue create --title "Demo refresh failed — the shim needs a human" \
              --label demo-refresh-failed --body "$body"
          fi
